{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block public_body %}
<div class="row justify-content-center align-items-center py-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-bank2"></i>
        </div>
        <h3 class="fw-bold mb-1">Welcome to BankVCS</h3>
        <p class="text-muted small">Sign in to your secure, version-controlled banking portal</p>
      </div>

      <form method="post" id="loginForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" name="username" id="loginUsername" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-semibold small">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" name="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
        </button>
      </form>

      <!-- Quick Demo Credentials Fill -->
      <div class="p-3 bg-light rounded-3 mb-3 border">
        <div class="small fw-bold text-muted text-uppercase mb-2" style="font-size: 0.7rem;">Demo Test Accounts</div>
        <div class="d-flex flex-wrap gap-1">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillLogin('sarika', 'Password123')">
            <i class="bi bi-person me-1"></i> Customer
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillLogin('staff1', 'Password123')">
            <i class="bi bi-shield me-1"></i> Employee
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillLogin('admin1', 'Password123')">
            <i class="bi bi-gear me-1"></i> Admin
          </button>
        </div>
      </div>

      <div class="text-center small text-muted">
        Don't have an account yet? 
        <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Open an Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillLogin(u, p) {
    document.getElementById('loginUsername').value = u;
    document.getElementById('loginPassword').value = p;
  }
</script>
{% endblock %}
