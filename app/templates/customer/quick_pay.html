{% extends "base.html" %}

{% block title %}Quick Pay & Recharge{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>Quick Pay & Utility Bill Payments</h3>
      <p class="text-muted mb-0">Instant mobile recharges, DTH, electricity, water, and gas bill payments.</p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-dark text-white py-3 rounded-top-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-credit-card-fill me-2"></i>Bill Payment & Instant Recharge</h5>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('customer.quick_pay') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label class="form-label fw-bold">Pay From Account</label>
              <select name="account_id" class="form-select" required>
                {% for acc in accounts %}
                  <option value="{{ acc.id }}">{{ acc.account_number }} ({{ acc.account_type }}) - Available: ₹{{ "{:,.2f}".format(acc.available_balance) }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Payment Category</label>
                <select name="category" class="form-select" id="payCategory">
                  <option value="MOBILE_RECHARGE">Mobile Prepaid / Postpaid</option>
                  <option value="DTH">DTH Recharge</option>
                  <option value="ELECTRICITY">Electricity Bill</option>
                  <option value="GAS">Piped Gas / LPG Cylinder</option>
                  <option value="WATER">Water Utility Bill</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Operator / Biller Name</label>
                <input type="text" name="biller_name" class="form-control" placeholder="e.g. Airtel, TNEB, Indane Gas" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Consumer Number / Mobile No.</label>
                <input type="text" name="consumer_number" class="form-control" placeholder="e.g. 9876543210 or Consumer ID" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Amount (₹)</label>
                <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="e.g. 299.00" required>
              </div>
            </div>

            <button type="submit" class="btn btn-warning text-dark fw-bold w-100 py-2">
              <i class="bi bi-shield-check me-1"></i> Proceed to Pay Securely
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
