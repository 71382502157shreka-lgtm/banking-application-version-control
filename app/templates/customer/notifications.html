{% extends "base.html" %}
{% block title %}Notifications Center{% endblock %}

{% block content %}
<div class="container-fluid px-0">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
    <div>
      <h2 class="font-display fw-bold mb-1"><i class="bi bi-bell text-emerald-600 me-2"></i> Notifications Center</h2>
      <p class="text-muted small mb-0">Stay informed about transaction alerts, security events, and version control updates.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-custom btn-sm" onclick="markAllAsReadPage()">
        <i class="bi bi-check2-all me-1"></i> Mark All as Read
      </button>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-8 mx-auto">
      <div class="card-custom p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-emerald" id="btnFilterAll" onclick="filterNotifs('ALL')">All</button>
            <button class="btn btn-sm btn-outline-custom" id="btnFilterUnread" onclick="filterNotifs('UNREAD')">Unread</button>
            <button class="btn btn-sm btn-outline-custom" id="btnFilterTxn" onclick="filterNotifs('TRANSACTION')">Transactions</button>
            <button class="btn btn-sm btn-outline-custom" id="btnFilterSec" onclick="filterNotifs('SECURITY')">Security</button>
          </div>
          <span class="text-xs text-muted font-mono" id="notifTotalCounter">0 notifications</span>
        </div>

        <div class="d-flex flex-column gap-2" id="notifFullFeed">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-emerald-600 me-2"></div> Loading notifications...
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let allNotifs = [];
  let currentFilter = 'ALL';

  document.addEventListener('DOMContentLoaded', () => {
    loadFullNotifications();
  });

  async function loadFullNotifications() {
    try {
      const res = await fetch('/api/notifications');
      if (!res.ok) return;
      const data = await res.json();
      allNotifs = data.notifications || [];
      renderNotifs();
    } catch (e) {
      console.error(e);
    }
  }

  function filterNotifs(filterType) {
    currentFilter = filterType;
    ['btnFilterAll', 'btnFilterUnread', 'btnFilterTxn', 'btnFilterSec'].forEach(id => {
      document.getElementById(id).className = 'btn btn-sm btn-outline-custom';
    });
    if (filterType === 'ALL') document.getElementById('btnFilterAll').className = 'btn btn-sm btn-emerald';
    else if (filterType === 'UNREAD') document.getElementById('btnFilterUnread').className = 'btn btn-sm btn-emerald';
    else if (filterType === 'TRANSACTION') document.getElementById('btnFilterTxn').className = 'btn btn-sm btn-emerald';
    else if (filterType === 'SECURITY') document.getElementById('btnFilterSec').className = 'btn btn-sm btn-emerald';

    renderNotifs();
  }

  function renderNotifs() {
    const list = document.getElementById('notifFullFeed');
    const counter = document.getElementById('notifTotalCounter');

    let filtered = allNotifs;
    if (currentFilter === 'UNREAD') filtered = allNotifs.filter(n => !n.is_read);
    else if (currentFilter === 'TRANSACTION') filtered = allNotifs.filter(n => n.notification_type === 'TRANSACTION');
    else if (currentFilter === 'SECURITY') filtered = allNotifs.filter(n => n.notification_type === 'SECURITY');

    counter.innerText = `${filtered.length} notification(s)`;

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="text-center py-5 text-muted">
          <i class="bi bi-bell-slash fs-2 d-block mb-2"></i>
          <div class="fw-bold">No Notifications Found</div>
          <div class="small">You're all caught up with your banking activities.</div>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(n => {
      let icon = 'bi-info-circle';
      let iconBg = 'bg-emerald-50 text-emerald-600';
      if (n.notification_type === 'SECURITY') { icon = 'bi-shield-exclamation'; iconBg = 'bg-rose-50 text-rose-600'; }
      else if (n.notification_type === 'TRANSACTION') { icon = 'bi-currency-exchange'; iconBg = 'bg-purple-50 text-plum-600'; }

      const dateStr = n.created_at ? new Date(n.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : 'Recent';

      return `
        <div class="p-3 rounded-3 border d-flex align-items-start gap-3 cursor-pointer ${n.is_read ? 'bg-surface' : 'bg-surface-elevated border-emerald-500'}" onclick="markSingleRead(${n.id})">
          <div class="p-2 rounded-circle ${iconBg} flex-shrink-0">
            <i class="bi ${icon} fs-5"></i>
          </div>
          <div class="flex-grow-1 overflow-hidden">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h6 class="fw-bold mb-0 font-display">${n.title}</h6>
              <span class="text-muted text-xs font-mono">${dateStr}</span>
            </div>
            <div class="text-muted small">${n.message}</div>
          </div>
          <div>
            ${!n.is_read ? '<span class="badge bg-emerald-500 text-white text-xs">NEW</span>' : '<i class="bi bi-check2-all text-muted"></i>'}
          </div>
        </div>
      `;
    }).join('');
  }

  async function markSingleRead(id) {
    try {
      await fetch(`/api/notifications/${id}/read`, { method: 'POST' });
      const item = allNotifs.find(n => n.id === id);
      if (item) item.is_read = true;
      renderNotifs();
      loadHeaderNotifications();
    } catch (e) { console.error(e); }
  }

  async function markAllAsReadPage() {
    try {
      await fetch('/api/notifications/read-all', { method: 'POST' });
      allNotifs.forEach(n => n.is_read = true);
      renderNotifs();
      showToast('All notifications marked as read', 'success');
      loadHeaderNotifications();
    } catch (e) { console.error(e); }
  }
</script>
{% endblock %}
