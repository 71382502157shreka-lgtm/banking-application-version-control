<!-- Floating AI Banking Assistant Chatbot Widget -->
<div id="ai-chatbot-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 1080;">
  <!-- Toggle Button -->
  <button id="ai-chatbot-toggle" class="btn btn-primary rounded-circle shadow-lg p-3 d-flex align-items-center justify-content-center" style="width: 56px; height: 56px;" title="Ask BankVCS AI Assistant">
    <i class="bi bi-robot fs-4 text-white"></i>
  </button>

  <!-- Chatbot Window Container -->
  <div id="ai-chatbot-window" class="card shadow-lg border-0 d-none" style="position: absolute; bottom: 70px; right: 0; width: 360px; max-width: 90vw; height: 480px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Chat Header -->
    <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between py-3 px-3">
      <div class="d-flex align-items-center">
        <div class="bg-white text-primary rounded-circle p-2 me-2 d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
          <i class="bi bi-cpu-fill fs-6"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-bold">BankVCS AI Assistant</h6>
          <small class="text-white-50" style="font-size: 0.75rem;"><i class="bi bi-shield-check me-1"></i>Secure Python Assistant</small>
        </div>
      </div>
      <button id="ai-chatbot-close" class="btn-close btn-close-white" aria-label="Close"></button>
    </div>

    <!-- Quick Suggestion Chips -->
    <div class="bg-light p-2 border-bottom overflow-auto text-nowrap" style="font-size: 0.8rem;">
      <span class="badge bg-white text-dark border me-1 ai-chip" style="cursor: pointer;" onclick="sendAiChip('How do I check my account balance?')">💰 Check Balance</span>
      <span class="badge bg-white text-dark border me-1 ai-chip" style="cursor: pointer;" onclick="sendAiChip('How do fund transfers work?')">💸 Transfers</span>
      <span class="badge bg-white text-dark border me-1 ai-chip" style="cursor: pointer;" onclick="sendAiChip('What is Entity Version Control?')">📜 Versioning</span>
      <span class="badge bg-white text-dark border me-1 ai-chip" style="cursor: pointer;" onclick="sendAiChip('How does the Risk Engine work?')">🛡️ Risk Engine</span>
    </div>

    <!-- Message Stream -->
    <div id="ai-chat-messages" class="card-body p-3 overflow-auto" style="flex: 1; font-size: 0.9rem; background-color: var(--bs-body-bg, #f8f9fa);">
      <div class="d-flex mb-3">
        <div class="bg-primary text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 85%;">
          Hello! I am your <strong>BankVCS AI Assistant</strong>. How can I help you with your account, transfers, version history, or security today?
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="ai-typing-indicator" class="px-3 py-1 text-muted d-none" style="font-size: 0.8rem;">
      <i class="bi bi-three-dots loading-dots me-1"></i> AI Assistant is thinking...
    </div>

    <!-- Input Footer -->
    <div class="card-footer bg-white p-2 border-top">
      <form id="ai-chat-form" class="d-flex gap-2" onsubmit="handleAiSubmit(event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        <input type="text" id="ai-chat-input" class="form-control form-control-sm rounded-pill px-3" placeholder="Ask AI Assistant..." required autocomplete="off">
        <button type="submit" class="btn btn-primary btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
          <i class="bi bi-send-fill text-white"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggleBtn = document.getElementById('ai-chatbot-toggle');
  const closeBtn = document.getElementById('ai-chatbot-close');
  const chatWindow = document.getElementById('ai-chatbot-window');

  if (toggleBtn && chatWindow) {
    toggleBtn.addEventListener('click', function() {
      chatWindow.classList.toggle('d-none');
    });
  }

  if (closeBtn && chatWindow) {
    closeBtn.addEventListener('click', function() {
      chatWindow.classList.add('d-none');
    });
  }
});

function sendAiChip(text) {
  const input = document.getElementById('ai-chat-input');
  if (input) {
    input.value = text;
    handleAiSubmit(new Event('submit'));
  }
}

function handleAiSubmit(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('ai-chat-input');
  const msgContainer = document.getElementById('ai-chat-messages');
  const indicator = document.getElementById('ai-typing-indicator');
  const query = input.value.trim();

  if (!query) return;

  // Append user message
  const userDiv = document.createElement('div');
  userDiv.className = 'd-flex justify-content-end mb-3';
  userDiv.innerHTML = `<div class="bg-secondary text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 85%;">${escapeHtml(query)}</div>`;
  msgContainer.appendChild(userDiv);
  input.value = '';
  msgContainer.scrollTop = msgContainer.scrollHeight;

  // Show typing indicator
  if (indicator) indicator.classList.remove('d-none');

  // Fetch CSRF token
  const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || '';

  fetch('/api/ai/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrfToken
    },
    body: JSON.stringify({ message: query })
  })
  .then(res => res.json())
  .then(data => {
    if (indicator) indicator.classList.add('d-none');
    const aiDiv = document.createElement('div');
    aiDiv.className = 'd-flex mb-3';
    
    const modeBadge = data.mode === 'gemini' ? '<span class="badge bg-success ms-1" style="font-size:0.65rem">Gemini AI</span>' : '';
    const replyText = data.reply || data.error || 'Sorry, I could not process that request.';
    
    aiDiv.innerHTML = `<div class="bg-light border text-dark rounded-3 p-2 px-3 shadow-sm" style="max-width: 85%;">${escapeHtml(replyText)} ${modeBadge}</div>`;
    msgContainer.appendChild(aiDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  })
  .catch(err => {
    if (indicator) indicator.classList.add('d-none');
    const errDiv = document.createElement('div');
    errDiv.className = 'd-flex mb-3';
    errDiv.innerHTML = `<div class="bg-danger text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 85%;">An error occurred while connecting to the assistant.</div>`;
    msgContainer.appendChild(errDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>
