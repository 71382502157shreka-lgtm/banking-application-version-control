<!-- Floating AI Banking Assistant Chatbot Widget -->
<div id="ai-chatbot-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 1080;" role="region" aria-label="AI Banking Assistant Widget">
  <!-- Toggle Button -->
  <button id="ai-chatbot-toggle" 
          class="btn btn-primary rounded-circle shadow-lg p-3 d-flex align-items-center justify-content-center" 
          style="width: 56px; height: 56px; transition: transform 0.2s ease;" 
          aria-label="Open AI Banking Assistant Chat" 
          title="Ask BankVCS AI Assistant">
    <i class="bi bi-robot fs-4 text-white"></i>
  </button>

  <!-- Chatbot Window Container -->
  <div id="ai-chatbot-window" 
       class="card shadow-lg border-0 d-none" 
       style="position: absolute; bottom: 70px; right: 0; width: 380px; max-width: 92vw; height: 520px; max-height: 85vh; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;" 
       role="dialog" 
       aria-label="BankVCS AI Assistant Chat Window">
    
    <!-- Chat Header -->
    <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between py-3 px-3">
      <div class="d-flex align-items-center">
        <div class="bg-white text-primary rounded-circle p-2 me-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
          <i class="bi bi-cpu-fill fs-6"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-bold">BankVCS AI Assistant</h6>
          <small class="text-white-50" style="font-size: 0.75rem;"><i class="bi bi-shield-check me-1"></i>Advisory &amp; Support Engine</small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1">
        <button id="ai-chatbot-clear" class="btn btn-sm text-white-50 p-1 hover-light" aria-label="Clear Chat History" title="Clear Chat History">
          <i class="bi bi-trash3 fs-6"></i>
        </button>
        <button id="ai-chatbot-close" class="btn-close btn-close-white ms-1" aria-label="Close AI Assistant"></button>
      </div>
    </div>

    <!-- Quick Suggestion Chips -->
    <div class="bg-light p-2 border-bottom overflow-auto text-nowrap" style="font-size: 0.8rem;" aria-label="Quick Action Chips">
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill me-1 py-0 px-2 ai-chip" onclick="sendAiChip('How do I check my account balance?')">💰 Check Balance</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill me-1 py-0 px-2 ai-chip" onclick="sendAiChip('How do fund transfers work?')">💸 Transfers</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill me-1 py-0 px-2 ai-chip" onclick="sendAiChip('What is Entity Version Control?')">📜 Versioning</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill me-1 py-0 px-2 ai-chip" onclick="sendAiChip('How does the Risk Engine work?')">🛡️ Risk Engine</button>
    </div>

    <!-- Alert / Error Banner -->
    <div id="ai-chat-error-banner" class="alert alert-danger py-2 px-3 m-2 d-none mb-0 small" role="alert"></div>

    <!-- Message Stream -->
    <div id="ai-chat-messages" class="card-body p-3 overflow-auto" style="flex: 1; font-size: 0.9rem; background-color: var(--bs-body-bg, #f8f9fa);" tabindex="0">
      <div class="d-flex mb-3">
        <div class="bg-primary text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 88%;">
          Hello! I am your <strong>BankVCS AI Assistant</strong>. How can I help you with your account balances, transfers, version history, or security settings today?
          <div class="text-white-50 text-end mt-1" style="font-size: 0.65rem;">Advisory Only</div>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="ai-typing-indicator" class="px-3 py-1 text-muted d-none" style="font-size: 0.8rem;">
      <i class="bi bi-three-dots loading-dots me-1"></i> AI Assistant is formulating advice...
    </div>

    <!-- Input Footer -->
    <div class="card-footer bg-white p-2 border-top">
      <form id="ai-chat-form" class="d-flex flex-column gap-1" onsubmit="handleAiSubmit(event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        <div class="d-flex gap-2 align-items-center">
          <textarea id="ai-chat-input" 
                    class="form-control form-control-sm rounded-3 px-3 py-2" 
                    rows="1" 
                    maxlength="500" 
                    placeholder="Ask AI Assistant... (Enter to send, Shift+Enter for new line)" 
                    aria-label="AI Assistant Input Question" 
                    required 
                    style="resize: none; font-size: 0.85rem; max-height: 80px;"></textarea>
          <button type="submit" 
                  id="ai-send-btn" 
                  class="btn btn-primary btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center flex-shrink-0" 
                  style="width: 36px; height: 36px;" 
                  aria-label="Send Message">
            <i class="bi bi-send-fill text-white"></i>
          </button>
        </div>
        <div class="d-flex justify-content-between px-1" style="font-size: 0.7rem; color: #888;">
          <span>Shift+Enter for newline</span>
          <span id="ai-char-counter">0/500</span>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggleBtn = document.getElementById('ai-chatbot-toggle');
  const closeBtn = document.getElementById('ai-chatbot-close');
  const clearBtn = document.getElementById('ai-chatbot-clear');
  const chatWindow = document.getElementById('ai-chatbot-window');
  const chatInput = document.getElementById('ai-chat-input');
  const charCounter = document.getElementById('ai-char-counter');

  if (toggleBtn && chatWindow) {
    toggleBtn.addEventListener('click', function() {
      chatWindow.classList.toggle('d-none');
      if (!chatWindow.classList.contains('d-none') && chatInput) {
        chatInput.focus();
      }
    });
  }

  if (closeBtn && chatWindow) {
    closeBtn.addEventListener('click', function() {
      chatWindow.classList.add('d-none');
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      clearChatHistory();
    });
  }

  if (chatInput) {
    chatInput.addEventListener('input', function() {
      if (charCounter) {
        charCounter.textContent = `${chatInput.value.length}/500`;
      }
      // Auto expand textarea height
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + 'px';
    });

    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleAiSubmit(e);
      }
    });
  }
});

function clearChatHistory() {
  const msgContainer = document.getElementById('ai-chat-messages');
  const errorBanner = document.getElementById('ai-chat-error-banner');
  if (errorBanner) errorBanner.classList.add('d-none');
  if (msgContainer) {
    msgContainer.innerHTML = `
      <div class="d-flex mb-3">
        <div class="bg-primary text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 88%;">
          Hello! I am your <strong>BankVCS AI Assistant</strong>. How can I help you with your account balances, transfers, version history, or security settings today?
          <div class="text-white-50 text-end mt-1" style="font-size: 0.65rem;">Advisory Only</div>
        </div>
      </div>
    `;
  }
}

function sendAiChip(text) {
  const input = document.getElementById('ai-chat-input');
  const chatWindow = document.getElementById('ai-chatbot-window');
  if (chatWindow && chatWindow.classList.contains('d-none')) {
    chatWindow.classList.remove('d-none');
  }
  if (input) {
    input.value = text;
    input.dispatchEvent(new Event('input'));
    handleAiSubmit(new Event('submit'));
  }
}

function handleAiSubmit(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('ai-chat-input');
  const msgContainer = document.getElementById('ai-chat-messages');
  const indicator = document.getElementById('ai-typing-indicator');
  const errorBanner = document.getElementById('ai-chat-error-banner');
  const charCounter = document.getElementById('ai-char-counter');
  
  if (errorBanner) errorBanner.classList.add('d-none');

  const query = input ? input.value.trim() : '';

  if (!query) return;

  if (query.length > 500) {
    if (errorBanner) {
      errorBanner.textContent = 'Message exceeds maximum length of 500 characters.';
      errorBanner.classList.remove('d-none');
    }
    return;
  }

  // Append user message
  const userDiv = document.createElement('div');
  userDiv.className = 'd-flex justify-content-end mb-3';
  userDiv.innerHTML = `<div class="bg-secondary text-white rounded-3 p-2 px-3 shadow-sm" style="max-width: 88%;">${escapeHtml(query)}</div>`;
  msgContainer.appendChild(userDiv);
  
  if (input) {
    input.value = '';
    input.style.height = 'auto';
  }
  if (charCounter) charCounter.textContent = '0/500';
  msgContainer.scrollTop = msgContainer.scrollHeight;

  // Show typing indicator
  if (indicator) indicator.classList.remove('d-none');

  // Fetch CSRF token
  const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || '';

  fetch('/api/ai/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrfToken
    },
    body: JSON.stringify({ message: query })
  })
  .then(res => {
    return res.json().then(data => ({ status: res.status, body: data }));
  })
  .then(({ status, body }) => {
    if (indicator) indicator.classList.add('d-none');

    if (status !== 200 || !body.success) {
      if (errorBanner) {
        errorBanner.textContent = body.error || 'Failed to process assistant request.';
        errorBanner.classList.remove('d-none');
      }
      return;
    }

    const aiDiv = document.createElement('div');
    aiDiv.className = 'd-flex mb-3';
    
    const modeBadge = body.mode === 'gemini' 
      ? '<span class="badge bg-success ms-1" style="font-size:0.65rem">Gemini AI</span>' 
      : '<span class="badge bg-secondary ms-1" style="font-size:0.65rem">Assistant Engine</span>';
      
    const replyText = body.reply || 'Sorry, I could not process that request.';
    
    aiDiv.innerHTML = `<div class="bg-light border text-dark rounded-3 p-2 px-3 shadow-sm" style="max-width: 88%;">${escapeHtml(replyText)} <div class="text-muted text-end mt-1" style="font-size:0.65rem">${modeBadge}</div></div>`;
    msgContainer.appendChild(aiDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  })
  .catch(err => {
    if (indicator) indicator.classList.add('d-none');
    if (errorBanner) {
      errorBanner.textContent = 'Network error connecting to AI Assistant.';
      errorBanner.classList.remove('d-none');
    }
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>
