{# Reusable Flash Messages Component #}
<div class="flash-messages-container mb-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category=='error' else category }} alert-dismissible fade show shadow-sm border-0" role="alert">
          <i class="bi {{ 'bi-exclamation-triangle-fill text-danger' if category=='error' else 'bi-check-circle-fill text-success' }} me-2 fs-5"></i>
          <span>{{ message }}</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>
