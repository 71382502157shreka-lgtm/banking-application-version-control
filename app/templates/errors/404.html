{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-lg border-0 rounded-4 p-5 mx-auto" style="max-width: 600px; background: var(--bg-surface);">
    <div class="mb-4">
      <span class="display-1 fw-extrabold text-muted">404</span>
    </div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">
      The page or financial record you requested could not be found or may have been moved.
    </p>
    <div>
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary px-4 py-2 rounded-3">
        <i class="bi bi-house-door-fill me-2"></i>Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
