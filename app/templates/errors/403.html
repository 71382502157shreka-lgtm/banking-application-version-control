{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-lg border-0 rounded-4 p-5 mx-auto" style="max-width: 600px; background: var(--bg-surface);">
    <div class="mb-4 text-danger">
      <i class="bi bi-shield-slash-fill display-1"></i>
    </div>
    <h2 class="fw-bold mb-3">Access Denied</h2>
    <p class="text-muted mb-4">
      You do not have permission to view this page or execute this role-restricted operation.
    </p>
    <div>
      <a href="{{ url_for('auth.index') }}" class="btn btn-danger px-4 py-2 rounded-3">
        <i class="bi bi-arrow-left me-2"></i>Go Back to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
