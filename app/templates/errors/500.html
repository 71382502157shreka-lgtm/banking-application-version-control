{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-lg border-0 rounded-4 p-5 mx-auto" style="max-width: 600px; background: var(--bg-surface);">
    <div class="mb-4 text-warning">
      <i class="bi bi-exclamation-triangle-fill display-1"></i>
    </div>
    <h2 class="fw-bold mb-3">Server Error</h2>
    <p class="text-muted mb-4">
      An unexpected internal server error occurred while processing your banking request. The transaction has been safely rolled back.
    </p>
    <div>
      <a href="{{ url_for('auth.index') }}" class="btn btn-warning text-dark fw-bold px-4 py-2 rounded-3">
        <i class="bi bi-house-fill me-2"></i>Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
